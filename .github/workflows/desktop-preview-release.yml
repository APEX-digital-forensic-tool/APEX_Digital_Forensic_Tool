name: Desktop preview release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-preview-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require main and an unused preview version
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Release from main only.');
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { releaseVersion } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/frontend/scripts/release-policy.mjs`));
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('frontend/package-lock.json', 'utf8'));
            const tag = `v${releaseVersion(pkg, lock)}`;
            if (!fs.existsSync(`docs/releases/${tag}-preview.md`)) throw new Error('Preview release notes required.');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({...context.repo, tag}),
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
            ]) {
              let exists = true;
              try { await request(); } catch (error) {
                if (error.status !== 404) throw error;
                exists = false;
              }
              if (exists) throw new Error(`${tag} already exists; never overwrite a release.`);
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', context.sha);
      # The merge that brought this commit to main started the same checks and builds in
      # desktop-ci.yml. This run repeats them on the same commit, so it takes over rather than
      # queue behind them for macOS runners. A failed cancel only costs time.
      - name: Cancel the main check run for this commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow desktop-ci.yml --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
            | xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY"
  build:
    needs: preflight
    uses: ./.github/workflows/desktop-build.yml
    with:
      full: true
      ref: ${{ needs.preflight.outputs.sha }}
      artifact-prefix: preview
      retention-days: 14
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: release-assets
          merge-multiple: true
      - name: Validate matching preview reports and artifact hashes
        run: node frontend/scripts/release-assets.mjs release-assets --preview
      - name: Publish verified certificate-free preview
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --prerelease \
            --title "APEX $RELEASE_TAG Preview" \
            --notes-file "docs/releases/$RELEASE_TAG-preview.md" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
