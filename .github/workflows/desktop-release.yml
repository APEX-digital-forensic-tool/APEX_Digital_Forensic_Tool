name: Signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require main, an unused version and Apple credentials
        id: check
        uses: actions/github-script@v7
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Release from main only.');
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { releaseVersion } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/frontend/scripts/release-policy.mjs`));
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('frontend/package-lock.json', 'utf8'));
            const tag = `v${releaseVersion(pkg, lock)}`;
            const required = ['MAC_CSC_LINK', 'MAC_CSC_KEY_PASSWORD', 'APPLE_API_KEY_BASE64',
                              'APPLE_API_KEY_ID', 'APPLE_API_ISSUER', 'APPLE_TEAM_ID'];
            const missing = required.filter(name => !process.env[name]?.trim());
            if (missing.length) throw new Error(`Missing repository secrets: ${missing.join(', ')}`);
            for (const request of [
              () => github.rest.repos.getReleaseByTag({...context.repo, tag}),
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
            ]) {
              let exists = true;
              try { await request(); } catch (error) {
                if (error.status !== 404) throw error;
                exists = false;
              }
              if (exists) throw new Error(`${tag} already exists; never overwrite a release.`);
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', context.sha);
      # The merge that brought this commit to main started the same checks and builds in
      # desktop-ci.yml. This run repeats them on the same commit, so it takes over rather than
      # queue behind them for macOS runners. A failed cancel only costs time.
      - name: Cancel the main check run for this commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow desktop-ci.yml --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
            | xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY"

  build:
    needs: preflight
    uses: ./.github/workflows/desktop-build.yml
    with:
      full: true
      ref: ${{ needs.preflight.outputs.sha }}
      signed: true
      artifact-prefix: release
      retention-days: 14
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Check all artifacts and generate checksums/provenance
        run: node frontend/scripts/release-assets.mjs release-assets
      - name: Publish only after every native build and verification passed
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --prerelease \
            --title "APEX $RELEASE_TAG Preview" \
            --notes-file "docs/releases/$RELEASE_TAG.md" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
